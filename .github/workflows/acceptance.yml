# Independent verification: a clean GitHub-hosted runner that has never seen the build
# session installs from the lockfile, runs the unit tests, then runs the full acceptance
# pipeline against the live npm registry and upstream git repository.
# Only a passing run here moves a component to "Verified".
name: acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install exactly what the lockfile pins
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end acceptance pipeline
        run: npm run pipeline
      - name: Assert Verified status and intact evidence chain
        run: |
          node dist/src/cli.js verify-evidence state/evidence/ci.jsonl
          node -e '
            const r = require("./state/registry.json").find(e => e.name === "chrono-node");
            console.log(r.name, r.version, r.status, "-", r.statusReason);
            if (r.status !== "Verified") process.exit(1);
          '
      - name: Product smoke test
        run: npm run extract -- fixtures/meeting-notes.txt --ref 2026-11-15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-node${{ matrix.node }}
          path: state/

  # Milestone 3: venture studio on a real PostgreSQL (RLS isolation, immutability, full acceptance flow).
  studio-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fe_owner
          POSTGRES_PASSWORD: fe_owner_ci
          POSTGRES_DB: fe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fe_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Studio acceptance on PostgreSQL 16
        env:
          FE_TEST_DATABASE_URL: postgres://fe_owner:fe_owner_ci@127.0.0.1:5432/fe_test
        run: |
          node --test dist/test/studio.test.js 2>&1 | tee studio.log
          grep -q "^# fail 0" studio.log && ! grep -q "^# skipped [1-9]" studio.log

  # Self-reproduction: the engine takes its own repository (from GitHub, at this exact commit)
  # through the same build-project interface used for founder repositories. Instance 1 is built
  # from the package alone, passes the acceptance chain, then rebuilds the engine itself; the
  # gen2 package must be byte-identical to gen1.
  self-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: build-project on own repository
        run: |
          node dist/src/cli.js build-project \
            --repo "https://github.com/${{ github.repository }}" \
            --rev "${{ github.sha }}" \
            --work "$RUNNER_TEMP/selfbuild/gen1"
      - name: Assert reproduction
        run: |
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/selfbuild/gen1/build-report.json");
            const c = require(process.env.RUNNER_TEMP + "/selfbuild/gen1/gen2/build-report.json");
            console.log("gen1", r.verdict, r.resolved_commit, r.package.integrity);
            console.log("gen2", c.verdict, c.resolved_commit, c.package.integrity);
            if (r.verdict !== "PASS" || c.verdict !== "PASS" || !r.reproducibility?.identical) process.exit(1);
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: self-rebuild-evidence
          path: |
            ${{ runner.temp }}/selfbuild/**/build-report.json
            ${{ runner.temp }}/selfbuild/**/evidence.jsonl
            ${{ runner.temp }}/selfbuild/**/*.tgz
            ${{ runner.temp }}/selfbuild/gen1/instance/state/
